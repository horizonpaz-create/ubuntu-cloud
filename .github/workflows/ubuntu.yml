name: Ubuntu 22.04 Cloud Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="horizon-ubuntu-$GITHUB_RUN_ID"
          for i in 1 2 3 4 5; do tailscale ip -4 && break || sleep 5; done
          tailscale status || true

      - name: Configure SSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          # Enable password auth like personal VPS
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ChallengeResponseAuthentication.*/ChallengeResponseAuthentication no/' /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo grep -q "^PermitRootLogin" /etc/ssh/sshd_config || echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config >/dev/null
          echo "runner:HorizonVPS2024!" | sudo chpasswd
          echo "root:HorizonRoot2024!" | sudo chpasswd
          sudo systemctl restart ssh || sudo systemctl start ssh

          echo "=========================================="
          echo " Ubuntu 22.04 SERVER IS READY"
          echo "=========================================="
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo ""
          echo "SSH user:"
          whoami
          echo "Hostname: $(hostname)"
          echo ""
          echo "SSH command:"
          echo "ssh $(whoami)@$(tailscale ip -4)"
          echo "ssh root@$(tailscale ip -4)"
          echo ""
          echo "Passwords: runner/HorizonVPS2024!  root/HorizonRoot2024!"
          echo "=========================================="
          echo "System info:"
          lscpu | grep "Model name" | head -n1
          free -h | head -n2
          df -h / | tail -n1

      - name: Keep Server Alive
        run: |
          for i in $(seq 1 350); do
            TSIP=$(tailscale ip -4 2>/dev/null || echo "no-ip")
            echo "[$i/350] $(date) - Tailscale:$TSIP - $(uptime -p) - tailscale status:"
            tailscale status --peers=false 2>&1 | head -n 20 || true
            sleep 60
          done
